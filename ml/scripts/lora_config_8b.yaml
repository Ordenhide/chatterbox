# LoRA fine-tune of Qwen3-8B -- see ml/README.md ("4B: two divergences,
# then a real result") for why this size is being tried and how the
# training-instability recipe below was worked out the hard way on 4B.
# Applying it from the start here instead of rediscovering it:
#
#   - optimizer: adamw -- decoupled weight decay, plain adam diverged
#     twice on 4B.
#   - grad_accumulation_steps: 4 -- effective batch 16 instead of 4,
#     smooths the noisy small-batch gradients that likely triggered both
#     4B divergences.
#   - learning_rate: 3.0e-6 -- the value that produced 4B's only clean,
#     monotonic run.
#   - grad_checkpoint: true -- essential here, not just helpful: 4B's
#     first attempt alone (no grad accumulation) already hit "Peak mem
#     68.493 GB" against this M5 Max's 48GB RAM, causing heavy swap. 8B
#     roughly doubles base-weight memory again, so this is non-optional at
#     this size, not just a stability nice-to-have.
#
# 36 layers deep, same as 4B (just wider: hidden_size 4096 vs 2560) --
# num_layers: 20 keeps the same ~57% "upper portion" ratio and identical
# raw layer count to the 4B config, so model size is the only variable
# that changed.
#
# iters=300 matches 4B's clean run exactly (same 1744-example dataset,
# same effective batch size of 16) for a direct comparison.

model: "ml/models/qwen3-8b-mlx"
train: true
data: "ml/data"
fine_tune_type: lora
optimizer: adamw
grad_checkpoint: true

num_layers: 20
mask_prompt: true

batch_size: 4
grad_accumulation_steps: 4
iters: 300
learning_rate: 3.0e-6
val_batches: -1
steps_per_report: 10
steps_per_eval: 10
save_every: 10
max_seq_length: 2048

adapter_path: "ml/adapters/qwen3-8b-summarizer"
seed: 42

name: Build & Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: write

# One place for the three names that have to agree with what exists in the
# Cloudflare account. APK_PUBLIC_URL is the site-facing twin of APK_URL in
# scripts/build-site-html.mjs — if they disagree, version.json points somewhere
# the download button does not.
env:
  CF_PAGES_PROJECT: chatterbox
  R2_BUCKET: chatterbox-downloads
  APK_PUBLIC_URL: https://dl.chatterbox.app/chatterbox-latest.apk

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Decodes the CHATTERBOX_KEYSTORE_BASE64 secret back into the .keystore
      # file that android/app/build.gradle expects at CHATTERBOX_STORE_FILE.
      - name: Decode release keystore
        run: echo "${{ secrets.CHATTERBOX_KEYSTORE_BASE64 }}" | base64 --decode > android/app/chatterbox-release.keystore

      # google-services.json is gitignored (never committed), so the
      # com.google.gms.google-services plugin has nothing to read from a
      # fresh checkout without this -- it's required by that plugin, not
      # optional, and its absence fails processReleaseGoogleServices before
      # any actual compilation.
      - name: Decode google-services.json
        run: echo "${{ secrets.CHATTERBOX_GOOGLE_SERVICES_JSON_BASE64 }}" | base64 --decode > android/app/google-services.json

      - name: Build release APK
        working-directory: android
        env:
          CHATTERBOX_STORE_FILE: chatterbox-release.keystore
          CHATTERBOX_STORE_PASSWORD: ${{ secrets.CHATTERBOX_STORE_PASSWORD }}
          CHATTERBOX_KEY_ALIAS: ${{ secrets.CHATTERBOX_KEY_ALIAS }}
          CHATTERBOX_KEY_PASSWORD: ${{ secrets.CHATTERBOX_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      # Only for an actual release tag — workflow_dispatch exists to test that
      # the signed build still works, and must not touch the live website or
      # need FIREBASE_SERVICE_ACCOUNT to do it.
      #
      # versionName/versionCode come straight out of build.gradle rather than
      # the git tag, so this can never drift from what Gradle actually built.
      # chatterbox-latest.apk is a stable object key (not versioned) so the
      # site's download link never has to change between releases — see
      # APK_URL's comment in scripts/build-site-html.mjs. version.json is
      # what src/services/updateCheck.ts polls to tell an installed app a
      # newer build exists, and it is small, so unlike the APK it can live in
      # the Pages deploy.
      #
      # The APK itself is NOT copied into website/. A Cloudflare Pages asset is
      # capped at 25 MiB and this file is ~122 MB, so a deploy carrying it
      # fails outright. It goes to R2 below, whose egress is free — which also
      # removes the $0.15/GB every download used to cost on Firebase Hosting
      # past the first 10 GB in a month, about 82 downloads.
      - name: Compute checksum and write the update manifest
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION_NAME=$(grep -oP 'versionName\s+"\K[^"]+' android/app/build.gradle)
          VERSION_CODE=$(grep -oP 'versionCode\s+\K[0-9]+' android/app/build.gradle)
          SHA256=$(sha256sum android/app/build/outputs/apk/release/app-release.apk | cut -d' ' -f1)
          RELEASED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          mkdir -p website/downloads
          cat > website/downloads/version.json <<EOF
          {"versionCode": $VERSION_CODE, "versionName": "$VERSION_NAME", "sha256": "$SHA256", "releasedAt": "$RELEASED_AT", "url": "$APK_PUBLIC_URL"}
          EOF

          echo "APK_SHA256=$SHA256" >> "$GITHUB_ENV"

      # Cloudflare replaced Firebase Hosting for the site on 2026-09-24. This
      # job no longer touches Google Cloud at all; FIREBASE_SERVICE_ACCOUNT is
      # still what deploy-functions.yml and deploy-rules.yml use.
      #
      # Checked before anything is published, and both at once, so a missing
      # pair is one failure naming both rather than two runs.
      - name: Check required secrets
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          [ -z "$CF_TOKEN" ] && missing="$missing CLOUDFLARE_API_TOKEN"
          [ -z "$CF_ACCOUNT" ] && missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::error::missing secret(s):$missing. See DEPLOYING.md."
            exit 1
          fi

      # website/app/ is the built web client. It is gitignored (.gitignore:117)
      # and produced by web/'s `build:site`, so a CI checkout does not contain
      # it — `git archive HEAD website` lists everything but `app/`.
      #
      # A Pages deploy replaces the site's whole file set rather than merging
      # into it, and website/index.html links to `/app/`. Without this step the
      # deploy below publishes a site whose own "open the web app" link 404s.
      # The step was missing from the moment the site deploy was added
      # (2026-09-20, for APK self-distribution) and could not be noticed,
      # because that deploy only runs on a `v*` tag and none has been pushed
      # since.
      #
      # `--base=/app/` is what makes one project serve both: the marketing
      # pages at / and the app at /app/. See wrangler.toml.
      #
      # `npm ci` here and not at the top: this is the only step that needs
      # web/node_modules, and the APK build must not wait on it.
      - name: Build the web client into website/app
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: web
        run: |
          npm ci
          npm run build:site

      # Before the Pages deploy, not after: the moment the site goes live it
      # advertises this object, so the object has to exist first.
      #
      # `--remote` is explicit because Cloudflare's own reference documents
      # `--local` and `--remote` without stating which is the default. Guessing
      # wrong here does not fail the run — it writes to a local simulated
      # bucket inside the runner, the runner is destroyed, and the release ships
      # a download link to nothing.
      #
      # The Content-Type matters: served as anything else, Android's package
      # installer will not open the file, and the browser offers to save it as
      # a blob instead. Firebase set this from firebase.json's `**/*.apk` rule,
      # which is gone with the rest of that config, so it is set on the object.
      - name: Upload the APK to R2
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler@4 r2 object put "${R2_BUCKET}/chatterbox-latest.apk" \
            --file=android/app/build/outputs/apk/release/app-release.apk \
            --content-type=application/vnd.android.package-archive \
            --remote

      - name: Deploy the site (Cloudflare Pages)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler@4 pages deploy website \
            --project-name="${CF_PAGES_PROJECT}" \
            --branch=main \
            --commit-dirty=true

      - name: Remove decoded keystore
        if: always()
        run: rm -f android/app/chatterbox-release.keystore android/app/google-services.json

      # always(), because this step is downstream of the Hosting deploy and
      # was gated on success by default — so a failure there threw away a
      # signed APK that had already been built, leaving nothing to download
      # and nothing to inspect. The APK is the expensive part of this job and
      # it is worth keeping whatever else went wrong.
      #
      # upload-artifact treats a missing path as a warning rather than an
      # error, so a run where the Gradle build itself failed still ends with
      # that build's error as the reason, not this step's.
      - name: Upload APK as build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chatterbox-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
          # A verification channel independent of the site itself: if
          # chatterbox.app were ever compromised, this SHA-256 lives on
          # GitHub instead and can be checked against either copy.
          body: |
            SHA-256: `${{ env.APK_SHA256 }}`

            Also published to https://chatterbox.app/#download — the same file.

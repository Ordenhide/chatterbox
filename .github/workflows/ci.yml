name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # `npx eslint src App.tsx`, never `npm run lint`.
      #
      # `npm run lint` is `eslint .`, which walks the vendored harmony/oh_modules
      # tree — thousands of files, one of them an esprima fixture that makes
      # react-native/no-inline-styles throw. It has been seen both exiting 0 on
      # that crash and simply not finishing in five minutes, so it reports
      # nothing either way. CI ran it anyway, under continue-on-error, which is
      # a step that cannot fail running a command that cannot succeed.
      #
      # Per rule, not one total.
      #
      # This was a single baseline over every rule at once, and that let a new
      # error of one kind hide behind a fixed error of another — the exact
      # regression the ratchet exists to stop. It also never tightened: the
      # step printed "lower BASELINE to lock it in" on every run for as long as
      # the count sat under it, and nobody did.
      #
      # So each rule carries its own number, and no-unused-vars carries zero.
      # That rule earns a hard gate: it is what found an 8MB image cap that was
      # declared and never enforced, and a message multi-select mode whose
      # delete handler had no caller and no cancel button — a mode a user could
      # enter and not get out of. Both had been shipped, and both were
      # invisible to every other check here, because a local function with no
      # callers is not a dead *export* and breaks no test.
      #
      # no-shadow and exhaustive-deps stay ratcheted. They are a real backlog
      # that predates any single change, and exhaustive-deps in particular
      # cannot be cleared mechanically: several are deliberate, with the
      # reasoning written above them, and "fixing" the rest by adding
      # dependencies is how a render loop ships.
      - name: Lint (per-rule baselines, no regression)
        run: |
          npx eslint src App.tsx -f json 2>/dev/null > /tmp/eslint.json || true
          node -e '
            const BASELINE = {
              "@typescript-eslint/no-unused-vars": 0,
              "@typescript-eslint/no-shadow": 24,
              "react-hooks/exhaustive-deps": 15,
            };
            const files = JSON.parse(require("fs").readFileSync("/tmp/eslint.json", "utf8"));
            const counts = {};
            let total = 0;
            for (const f of files) {
              for (const m of f.messages) {
                if (m.severity !== 2) continue;
                counts[m.ruleId] = (counts[m.ruleId] || 0) + 1;
                total++;
              }
            }
            let failed = false;
            for (const rule of new Set([...Object.keys(BASELINE), ...Object.keys(counts)])) {
              const got = counts[rule] || 0;
              const max = BASELINE[rule];
              if (max === undefined) {
                console.log(`::error::${rule}: ${got} error(s), and this rule has no baseline. ` +
                  "Fix them, or add the rule to BASELINE in ci.yml with the reason in the comment above.");
                failed = true;
              } else if (got > max) {
                console.log(`::error::${rule}: ${got} error(s), baseline ${max}. Fix the new ones.`);
                failed = true;
              } else if (got < max) {
                console.log(`::notice::${rule}: down to ${got} from ${max} — lower it in ci.yml to lock it in.`);
              } else {
                console.log(`${rule}: ${got} (at baseline)`);
              }
            }
            console.log(`eslint errors: ${total}`);
            if (failed) process.exit(1);
          '

      # Blocking now. The comment this replaces said there were ~58 pre-existing
      # type errors and left the step non-blocking until the backlog cleared.
      # The backlog is cleared — `npx tsc --noEmit` reports nothing — so the
      # justification had outlived the condition, and an ungated typecheck is
      # how a type error reaches main.
      - name: Type check
        run: npx tsc --noEmit

      - name: Test
        run: npm test -- --ci

  # The web client and Cloud Functions have their own package.json, lockfile
  # and test runner, so the root `npm ci && npm test` above never touched
  # them — their suites were being written and run locally but never gated a
  # PR. They get their own jobs rather than extra steps so a failure points at
  # the right project and the three suites run in parallel.
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The root install too, and not for convenience.
      #
      # crossClient.test.ts imports the mobile client's e2ee, mediaCrypto and
      # messageBody to prove the two implementations still agree — that is the
      # whole point of it. Those files live outside web/, so TypeScript
      # resolves *their* imports from their own directory upward, reaching the
      # repository root's node_modules and not web's. Without this the type
      # check fails on @noble/*, which is how this job sat red: it passes on a
      # developer's machine, where the root install happens to be there.
      - name: Install root dependencies (the mobile sources this type-checks)
        working-directory: .
        run: npm ci

      # Blocking, unlike the mobile typecheck above: the web client is at zero
      # type errors today, so there is no backlog to grandfather in and no
      # reason to let it regress.
      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      # `build:site`, not `build`: it is the command the release workflow runs
      # to produce website/app, and it differs by --base=/app/ and an outDir
      # outside the project root. Nothing exercised either until a `v*` tag
      # ran it for the first time, during a deploy — the most expensive place
      # to discover the production build is broken. Cheap here, and it also
      # type-checks via `tsc -b`, which `typecheck`'s --noEmit does not.
      - name: Build the site bundle (what the release deploys)
        run: npm run build:site

  functions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Covers the pure modules the callables delegate to — entitlement
      # (the Pro paywall), aiChat, translate, speechToText and the SSRF guard.
      - name: Test
        run: npm test

  rules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      # Runs the actual firestore.rules / storage.rules against a real
      # emulator (test/rules/) — a PR that weakens a rule or reintroduces the
      # $(database)-in-Storage-rules class of bug fails here, before merge,
      # rather than surfacing as a user-facing "everything is denied" report.
      - name: Firestore & Storage rules tests
        run: npm run test:rules

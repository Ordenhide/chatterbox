name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Lint and typecheck currently fail on pre-existing issues (~70 lint errors,
      # ~58 type errors) unrelated to any single change. Left non-blocking so they're
      # visible in CI output without blocking every PR; flip to blocking once the
      # backlog is cleared (see PR description / project notes).
      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Type check
        run: npx tsc --noEmit
        continue-on-error: true

      - name: Test
        run: npm test -- --ci

  # The web client and Cloud Functions have their own package.json, lockfile
  # and test runner, so the root `npm ci && npm test` above never touched
  # them — their suites were being written and run locally but never gated a
  # PR. They get their own jobs rather than extra steps so a failure points at
  # the right project and the three suites run in parallel.
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Blocking, unlike the mobile typecheck above: the web client is at zero
      # type errors today, so there is no backlog to grandfather in and no
      # reason to let it regress.
      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

  functions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Covers the pure modules the callables delegate to — entitlement
      # (the Pro paywall), aiChat, translate, speechToText and the SSRF guard.
      - name: Test
        run: npm test

  rules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      # Runs the actual firestore.rules / storage.rules against a real
      # emulator (test/rules/) — a PR that weakens a rule or reintroduces the
      # $(database)-in-Storage-rules class of bug fails here, before merge,
      # rather than surfacing as a user-facing "everything is denied" report.
      - name: Firestore & Storage rules tests
        run: npm run test:rules

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # `npx eslint src App.tsx`, never `npm run lint`.
      #
      # `npm run lint` is `eslint .`, which walks the vendored harmony/oh_modules
      # tree — thousands of files, one of them an esprima fixture that makes
      # react-native/no-inline-styles throw. It has been seen both exiting 0 on
      # that crash and simply not finishing in five minutes, so it reports
      # nothing either way. CI ran it anyway, under continue-on-error, which is
      # a step that cannot fail running a command that cannot succeed.
      #
      # A ratchet instead of a gate, because `src` carries a real backlog of
      # shadowing and exhaustive-deps errors that predates any single change.
      # The count may go down freely; it may not go up. That is the property
      # that was actually wanted, and it is checkable.
      - name: Lint (no regression against the recorded baseline)
        run: |
          BASELINE=62
          COUNT=$(npx eslint src App.tsx -f json 2>/dev/null             | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).reduce((n,f)=>n+f.errorCount,0)))')
          echo "eslint errors: $COUNT (baseline $BASELINE)"
          if [ "$COUNT" -gt "$BASELINE" ]; then
            echo "::error::eslint errors rose from $BASELINE to $COUNT. Fix the new ones,"                  "or lower the baseline in this workflow if you cleared some."
            exit 1
          fi
          if [ "$COUNT" -lt "$BASELINE" ]; then
            echo "::notice::eslint errors fell to $COUNT — lower BASELINE in ci.yml to lock it in."
          fi

      # Blocking now. The comment this replaces said there were ~58 pre-existing
      # type errors and left the step non-blocking until the backlog cleared.
      # The backlog is cleared — `npx tsc --noEmit` reports nothing — so the
      # justification had outlived the condition, and an ungated typecheck is
      # how a type error reaches main.
      - name: Type check
        run: npx tsc --noEmit

      - name: Test
        run: npm test -- --ci

  # The web client and Cloud Functions have their own package.json, lockfile
  # and test runner, so the root `npm ci && npm test` above never touched
  # them — their suites were being written and run locally but never gated a
  # PR. They get their own jobs rather than extra steps so a failure points at
  # the right project and the three suites run in parallel.
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The root install too, and not for convenience.
      #
      # crossClient.test.ts imports the mobile client's e2ee, mediaCrypto and
      # messageBody to prove the two implementations still agree — that is the
      # whole point of it. Those files live outside web/, so TypeScript
      # resolves *their* imports from their own directory upward, reaching the
      # repository root's node_modules and not web's. Without this the type
      # check fails on @noble/*, which is how this job sat red: it passes on a
      # developer's machine, where the root install happens to be there.
      - name: Install root dependencies (the mobile sources this type-checks)
        working-directory: .
        run: npm ci

      # Blocking, unlike the mobile typecheck above: the web client is at zero
      # type errors today, so there is no backlog to grandfather in and no
      # reason to let it regress.
      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

  functions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Covers the pure modules the callables delegate to — entitlement
      # (the Pro paywall), aiChat, translate, speechToText and the SSRF guard.
      - name: Test
        run: npm test

  rules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      # Runs the actual firestore.rules / storage.rules against a real
      # emulator (test/rules/) — a PR that weakens a rule or reintroduces the
      # $(database)-in-Storage-rules class of bug fails here, before merge,
      # rather than surfacing as a user-facing "everything is denied" report.
      - name: Firestore & Storage rules tests
        run: npm run test:rules

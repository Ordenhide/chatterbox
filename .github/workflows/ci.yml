name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Lint and typecheck currently fail on pre-existing issues (~70 lint errors,
      # ~58 type errors) unrelated to any single change. Left non-blocking so they're
      # visible in CI output without blocking every PR; flip to blocking once the
      # backlog is cleared (see PR description / project notes).
      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Type check
        run: npx tsc --noEmit
        continue-on-error: true

      - name: Test
        run: npm test -- --ci

  rules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      # Runs the actual firestore.rules / storage.rules against a real
      # emulator (test/rules/) — a PR that weakens a rule or reintroduces the
      # $(database)-in-Storage-rules class of bug fails here, before merge,
      # rather than surfacing as a user-facing "everything is denied" report.
      - name: Firestore & Storage rules tests
        run: npm run test:rules

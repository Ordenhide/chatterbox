name: Deploy Firestore & Storage Rules

# Firestore and Storage security rules are deployed independently of the app
# code that assumes they're live — a rules file can sit committed but
# undeployed indefinitely with no error anywhere, because nothing checks that
# the deployed rules match what's in the repo. That gap is exactly what
# happened here once already: storage.rules referenced $(database), a
# Firestore-only binding that doesn't exist in Storage rules, so every
# upload was silently rejected for 6 months against a rules revision the repo
# had already fixed locally. Deploying automatically on every change removes
# the "did anyone actually run the deploy command" step entirely — and the
# test job below, run against a real emulator (see test/rules/), is what
# would have caught that exact bug the moment it was introduced instead of
# via a user report 6 months later.
#
# Firestore *indexes* are deployed here too, despite the name, and for the
# same reason: they have exactly the same "committed but never deployed" gap,
# and it bit in exactly the same way — three scheduled Cloud Functions failing
# every run on a missing index while reporting success. The workflow name is
# left alone so any status check referencing it keeps matching.

on:
  workflow_dispatch: # Manual trigger
  push:
    branches: [main, master]
    paths:
      - 'firestore.rules'
      - 'storage.rules'
      # Without this an index-only change deploys nothing: the file is not a
      # rules file, so no path here matched it and the workflow never ran.
      # That is half of why indexes drifted from the repo for so long — the
      # other half being that no step deployed them even when it did run.
      - 'firestore.indexes.json'
      - 'test/rules/**'
      - '.github/workflows/deploy-rules.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # The Firestore/Storage emulators require a JDK — ubuntu-latest's
      # default may not be new enough (firebase-tools requires 21+), so this
      # pins it explicitly rather than relying on whatever the runner image
      # currently ships.
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Run rules tests against the emulator
        run: npm run test:rules

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Setup required (one-time, shared with deploy-functions.yml): a GCP
      # service account for project chatterbox-e5d10 with at least "Firebase
      # Rules Admin" (or the broader "Firebase Admin"), with its JSON key
      # stored as the FIREBASE_SERVICE_ACCOUNT repo secret.
      # Same reasoning as deploy-functions.yml: without this secret the auth
      # action fails on malformed credentials and never names the secret.
      - name: Check required secrets
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SERVICE_ACCOUNT" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT is not set, so the rules cannot be" \
                 "deployed. The rules *tests* above ran against the emulator and do not" \
                 "need it. See DEPLOYING.md."
            exit 1
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'

      # Deployed as two steps, not one `--only firestore:rules,storage:rules`.
      #
      # firebase-tools runs storage first and aborts the whole command when it
      # fails, so a problem confined to Storage silently took the Firestore
      # rules down with it — twice, on the first two real deploy attempts: once
      # on a missing serviceusage permission, once on the default bucket. Both
      # times the Firestore rules were never even attempted, and the run just
      # said "failure".
      #
      # That is the same shape as the bug this workflow's header describes: a
      # rules file sitting undeployed with no error pointing at it. Splitting
      # the steps means each half reports its own outcome, and one being broken
      # cannot hide the other.
      #
      # `if: always()` on the second step, so Storage is still attempted when
      # Firestore fails — and the job still fails if either does.
      - name: Deploy Firestore rules
        run: npx firebase-tools@^15 deploy --only firestore:rules --project chatterbox-e5d10 --non-interactive

      # Indexes were never deployed by anything. firestore.indexes.json was
      # committed, reviewed and merged like the rules beside it, and went
      # nowhere — so the file said one thing and the project did another, with
      # nothing to notice the gap.
      #
      # That is not cosmetic. processScheduledMessages, processReminders and
      # sweepExpiredLiveLocations all query with collectionGroup, all needed an
      # index declared at COLLECTION_GROUP scope, and all failed every run with
      # "The query requires an index" — caught, logged, and returned as
      # success, so scheduled messages sat undelivered for over twelve hours
      # while the scheduler looked perfectly healthy. The scope was fixed in
      # firestore.indexes.json, but only a manual deploy actually shipped it.
      #
      # Deploying without --force on purpose: an index in the project that is
      # absent from the file is reported and left alone. Dropping an index is
      # not something a merge should be able to do silently, and the CLI's
      # notice is the prompt to do it deliberately.
      #
      # `if: always()` for the same reason as Storage below — each deploy
      # reports its own outcome, and one failing cannot hide the others.
      - name: Deploy Firestore indexes
        if: always()
        run: npx firebase-tools@^15 deploy --only firestore:indexes --project chatterbox-e5d10 --non-interactive

      # `--only storage`, not `storage:rules`. Firestore accepts sub-selectors
      # (firestore:rules, firestore:indexes); Storage does not — there
      # `storage:<name>` means a *deploy target*, so `storage:rules` sends
      # firebase-tools looking for a target called "rules" and it fails with
      # "Could not find rules for the following storage targets: rules".
      #
      # The original combined command had this too. It never showed, because
      # both earlier attempts died on IAM before reaching the argument.
      - name: Deploy Storage rules
        if: always()
        run: npx firebase-tools@^15 deploy --only storage --project chatterbox-e5d10 --non-interactive

name: Deploy Firebase Functions

on:
  workflow_dispatch: # Manual trigger
  push:
    branches: [main, master]
    paths:
      - 'functions/**'
      - '.github/workflows/deploy-functions.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Install function dependencies
        run: |
          cd functions
          npm ci

      # Not a secret, and deliberately a literal rather than one: without
      # CHATTERBOX_ENABLE_SCHEDULED the six pubsub functions strip themselves
      # from `exports` during discovery, so a deploy from here would *delete*
      # them from production — including processExpiredMessages, which is what
      # actually expires disappearing messages. See the note beside
      # SCHEDULED_ENABLED in functions/index.js.
      #
      # functions/.env is gitignored, so the checkout above never contains it
      # and every process.env lookup in index.js would be undefined in
      # production — Stripe billing would deploy but permanently answer
      # "Billing is not configured." firebase-tools reads this file at deploy
      # time and bakes the values into the deployed function config, so it has
      # to be rebuilt here from repo secrets (Settings → Secrets and variables
      # → Actions). Missing secrets write as empty, which degrades that one
      # feature rather than failing the deploy — matching how index.js treats
      # them. See functions/.env.example for what each value is.
      - name: Write functions/.env from repo secrets
        run: |
          cat > functions/.env <<'EOF'
          STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET=${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_PRICE_MONTHLY=${{ secrets.STRIPE_PRICE_MONTHLY }}
          STRIPE_PRICE_YEARLY=${{ secrets.STRIPE_PRICE_YEARLY }}
          APP_BASE_URL=${{ secrets.APP_BASE_URL }}
          CLOUDFLARE_ACCOUNT_ID=${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN=${{ secrets.CLOUDFLARE_API_TOKEN }}
          CHATTERBOX_ENABLE_SCHEDULED=true
          EOF

      # `FirebaseExtended/action-hosting-deploy` (the previous step here) only
      # deploys Firebase Hosting — it has no mechanism for Cloud Functions, so
      # this workflow never actually shipped a function no matter how many
      # times it ran. This authenticates a real GCP service account instead
      # and calls the Firebase CLI directly, which is what actually deploys
      # functions.
      #
      # Setup required (one-time): create a service account in the GCP
      # console for project chatterbox-e5d10, grant it "Cloud Functions
      # Admin", "Service Account User", and "Cloud Build Editor" (2nd-gen
      # functions build via Cloud Build), generate a JSON key, and store the
      # full key file contents as the FIREBASE_SERVICE_ACCOUNT repo secret.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'

      # Scheduled (pubsub) functions are intentionally excluded from
      # `exports` unless CHATTERBOX_ENABLE_SCHEDULED=true (see the comment at
      # the top of functions/index.js) because they require the Blaze plan
      # and would otherwise fail this deploy entirely if billing isn't
      # enabled. Left unset here so the default deploy stays safe; flip it on
      # once billing is confirmed enabled, either here or via a manual
      # `workflow_dispatch` run with the env var set.
      - name: Deploy functions
        run: npx firebase-tools@^15 deploy --only functions --project chatterbox-e5d10 --non-interactive

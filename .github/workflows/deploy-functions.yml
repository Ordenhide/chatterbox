name: Deploy Firebase Functions

on:
  workflow_dispatch: # Manual trigger
  push:
    branches: [main, master]
    paths:
      - 'functions/**'
      - '.github/workflows/deploy-functions.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Install function dependencies
        run: |
          cd functions
          npm ci

      # Not a secret, and deliberately a literal rather than one: without
      # CHATTERBOX_ENABLE_SCHEDULED the six pubsub functions strip themselves
      # from `exports` during discovery, so a deploy from here would *delete*
      # them from production — including processExpiredMessages, which is what
      # actually expires disappearing messages. See the note beside
      # SCHEDULED_ENABLED in functions/index.js.
      #
      # functions/.env is gitignored, so the checkout above never contains it
      # and every process.env lookup in index.js would be undefined in
      # production — the AI callables would deploy but permanently answer
      # "not configured". firebase-tools reads this file at deploy
      # time and bakes the values into the deployed function config, so it has
      # to be rebuilt here from repo secrets (Settings → Secrets and variables
      # → Actions). Missing secrets write as empty, which degrades that one
      # feature rather than failing the deploy — matching how index.js treats
      # them. See functions/.env.example for what each value is.
      # A missing FIREBASE_SERVICE_ACCOUNT fails two steps later inside
      # google-github-actions/auth, with a message about malformed credentials
      # that never mentions the repo secret you actually have to set. Checking
      # here costs nothing and turns twenty minutes of confusion into one line.
      #
      # The optional secrets below are deliberately *not* fatal: index.js
      # treats each as a feature switch, so a deploy without them ships an app
      # with that one feature disabled rather than no app at all. They are
      # reported so that state is a decision rather than a surprise.
      - name: Check required secrets
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$SERVICE_ACCOUNT" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT is not set. Create a service account for" \
                 "project chatterbox-e5d10 with Cloud Functions Admin, Service Account User," \
                 "and Cloud Build Editor, then store the whole JSON key as this repo secret." \
                 "See DEPLOYING.md."
            exit 1
          fi

          missing=""
          for name in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN; do
            eval "value=\${$name}"
            # An `if` rather than `[ ... ] && ...`: steps run under `bash -e`,
            # where a trailing AND-list that evaluates false is one shell-option
            # change away from aborting the step in exactly the case where
            # everything is correctly configured.
            if [ -z "$value" ]; then
              missing="$missing $name"
            fi
          done

          if [ -n "$missing" ]; then
            echo "::warning::Deploying without:$missing — billing and media-transform" \
                 "features will be disabled in the deployed functions. See DEPLOYING.md."
            echo "### Deployed with features disabled" >> "$GITHUB_STEP_SUMMARY"
            echo "Missing secrets:$missing" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Write functions/.env from repo secrets
        run: |
          cat > functions/.env <<'EOF'
          CLOUDFLARE_ACCOUNT_ID=${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN=${{ secrets.CLOUDFLARE_API_TOKEN }}
          CHATTERBOX_ENABLE_SCHEDULED=true
          CHATTERBOX_ENFORCE_APP_CHECK=${{ vars.CHATTERBOX_ENFORCE_APP_CHECK }}
          EOF

      # `FirebaseExtended/action-hosting-deploy` (the previous step here) only
      # deploys Firebase Hosting — it has no mechanism for Cloud Functions, so
      # this workflow never actually shipped a function no matter how many
      # times it ran. This authenticates a real GCP service account instead
      # and calls the Firebase CLI directly, which is what actually deploys
      # functions.
      #
      # Setup required (one-time): create a service account in the GCP
      # console for project chatterbox-e5d10, grant it "Cloud Functions
      # Admin", "Service Account User", and "Cloud Build Editor" (2nd-gen
      # functions build via Cloud Build), generate a JSON key, and store the
      # full key file contents as the FIREBASE_SERVICE_ACCOUNT repo secret.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'

      # `--force` on the deploy below is what lets it delete functions that
      # no longer exist in source. Without it the CLI aborts the *entire*
      # deploy in non-interactive mode rather than just skipping the
      # deletions — which is how production sat six days behind the
      # repository: Stripe and the dead man's switch had been deleted from
      # source, every push after that failed on "deletion cannot proceed in
      # non-interactive mode", and nobody read the red.
      #
      # There is exactly one way --force turns dangerous. The step above pins
      # CHATTERBOX_ENABLE_SCHEDULED=true in functions/.env; if that ever
      # stopped reaching the file, index.js would strip the five pubsub
      # functions from `exports` during discovery and --force would delete
      # them from production — including processExpiredMessages, which is what
      # actually expires disappearing messages — instead of aborting. So check
      # the precondition rather than trust it. A text check, not a `require`:
      # loading index.js to inspect its exports can fail for reasons that have
      # nothing to do with the flag, and a guard that fails for unrelated
      # reasons gets disabled.
      - name: Refuse to force-deploy without the scheduled flag
        run: |
          if ! grep -qx 'CHATTERBOX_ENABLE_SCHEDULED=true' functions/.env; then
            echo "::error::functions/.env does not set CHATTERBOX_ENABLE_SCHEDULED=true."
            echo "::error::Deploying with --force in that state would DELETE the scheduled"
            echo "::error::functions from production. Fix the .env step above; do not"
            echo "::error::remove this check."
            exit 1
          fi
          echo "scheduled flag present — safe to deploy with --force"

      - name: Deploy functions
        run: npx firebase-tools@^15 deploy --only functions --project chatterbox-e5d10 --non-interactive --force

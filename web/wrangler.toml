# Cloudflare Pages config for the Chatterbox web client (a Vite SPA).
# Lives in web/, so paths here are relative to web/.
#
# Deploy from this folder:
#   npm run build                 # → web/dist
#   npx wrangler pages deploy      # picks up this file
#
# First run creates a Pages project named `name` if it doesn't exist.
name = "chatterbox"
compatibility_date = "2026-07-24"

# Marks this as a Pages project and points at the Vite build output.
pages_build_output_dir = "dist"

# NOTE on env vars: the app's VITE_* values are inlined by Vite at BUILD time,
# so they do NOT go here (wrangler [vars] are runtime bindings for Pages
# Functions, which this static SPA doesn't use). Set VITE_* as build-time
# variables in the Cloudflare dashboard (Pages → Settings → Environment
# variables) or export them before `npm run build` for CLI deploys.

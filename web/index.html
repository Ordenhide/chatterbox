<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Chatterbox</title>
    <meta name="description" content="Chat, share moments, and call your friends — the Chatterbox web app." />
    <!-- #0a0a14 was the old indigo identity. These are --cb-canvas, so the
         browser chrome matches the page instead of a colour the app no
         longer uses anywhere. -->
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#e9ede9" media="(prefers-color-scheme: light)" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <!-- Both spellings: the apple- prefix is deprecated (and warns in Chrome)
         but is still what older iOS Safari reads for standalone mode. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Chatterbox" />
    <!-- The three faces the mobile app ships as linked assets (see
         src/theme/typography.ts there). Loaded from Google Fonts rather than
         self-hosted because this client has no bundler step for binary assets
         and the mobile app is the one that must work offline. `display=swap`
         so a slow font never blocks first paint — the fallback stacks in
         styles.css are ordered to keep the layout close while it loads. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

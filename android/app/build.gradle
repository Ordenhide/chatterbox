apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.google.gms.google-services"
apply plugin: "com.facebook.react"

react {
    nodeExecutableAndArgs.set([rootProject.ext.NODE_BINARY])
    // Required so the app gets implementation project() for each native module (fixes "package does not exist").
    autolinkLibrariesWithApp()

    // `./gradlew assembleDebug -PbundleJsInDebug` builds a debug APK that
    // carries its own JS bundle, so it runs on a phone with no Metro server
    // in front of it. An ordinary debug APK for this app ships eight font
    // files and no bundle at all, which makes it useless anywhere the dev
    // server is not reachable.
    //
    // The plugin bundles every variant *except* the ones named here, so
    // emptying the list is what turns bundling on for debug. Without the
    // flag the list keeps its default of ["debug"] and the normal
    // Metro-backed dev build is unchanged.
    //
    // The result is still `android:debuggable`, so ART will not AOT-compile
    // it and its data is readable over adb: it is for checking that things
    // work, never for measuring how fast they are, and never for an account
    // whose recovery phrase matters.
    if (project.hasProperty('bundleJsInDebug')) {
        debuggableVariants.set([])
    }
}

def enableProguardInReleaseBuilds = true

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = 'org.webkit:android-jsc-intl:+'`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'org.webkit:android-jsc:+'

// Release signing credentials come from the environment or gradle.properties —
// never from this file. Set these in ~/.gradle/gradle.properties or in CI:
//   CHATTERBOX_STORE_FILE=/path/to/release.keystore
//   CHATTERBOX_STORE_PASSWORD=...
//   CHATTERBOX_KEY_ALIAS=...
//   CHATTERBOX_KEY_PASSWORD=...
// Declared at script scope so the task-graph guard at the bottom can read them.
def releaseStoreFile = System.getenv("CHATTERBOX_STORE_FILE") ?: project.findProperty("CHATTERBOX_STORE_FILE")
def releaseStorePassword = System.getenv("CHATTERBOX_STORE_PASSWORD") ?: project.findProperty("CHATTERBOX_STORE_PASSWORD")
def releaseKeyAlias = System.getenv("CHATTERBOX_KEY_ALIAS") ?: project.findProperty("CHATTERBOX_KEY_ALIAS")
def releaseKeyPassword = System.getenv("CHATTERBOX_KEY_PASSWORD") ?: project.findProperty("CHATTERBOX_KEY_PASSWORD")

def hasReleaseSigning = releaseStoreFile && releaseStorePassword && releaseKeyAlias && releaseKeyPassword

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.chatterbox.app"
    defaultConfig {
        applicationId "com.chatterbox.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 3
        versionName "1.2"
    }
    // There is deliberately no debug-keystore fallback here any more. The
    // release variant gets a signing config only when real credentials exist;
    // otherwise it gets none, and the task-graph check below refuses to build
    // it at all.
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
    sourceSets {
        main {
            java {
                // Avoid duplicate PackageList from legacy rncli generator.
                exclude "**/generated/rncli/**"
            }
        }
    }
}

afterEvaluate {
    // Use the new autolinking task; disable legacy generator to avoid duplicates.
    tasks.matching { it.name == "generatePackageList" }.configureEach {
        enabled = false
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")
    // Block Store — the E2EE key's automatic restore on a new device.
    // See KeyBackupModule.java; play-services-auth is already here transitively
    // via Google Sign-In, this adds only the blockstore artifact.
    implementation("com.google.android.gms:play-services-auth-blockstore:16.4.0")

    // Firebase BoM for consistent SDK versions (aligned with @react-native-firebase 21.7.x)
    implementation platform('com.google.firebase:firebase-bom:34.16.0')
    implementation 'com.google.firebase:firebase-database'

    // Fresco animated GIF/WebP — must match RN 0.80's Fresco 3.6.0
    implementation 'com.facebook.fresco:animated-gif:3.6.0'
    implementation 'com.facebook.fresco:animated-webp:3.6.0'
    implementation 'com.facebook.fresco:webpsupport:3.6.0'

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

// Refuse to produce a release artifact without real signing credentials.
//
// The previous version of this guard tested `gradle.startParameter.taskNames`
// for the substring "release". `./gradlew build` contains no such substring,
// so it walked straight past and signed the release variant with the public
// Android debug key by way of a `?: "debug.keystore"` fallback — leaving a
// 130MB app-release.apk in build/outputs that was, by filename, identical to a
// shippable one. Both the fallback and the string test are gone.
//
// This reads the *resolved task graph* instead, so every route in — assemble,
// bundle, install, or a bare `build` that happens to pull the release variant
// along — is caught, and caught before forty minutes of compilation rather
// than after.
if (!hasReleaseSigning) {
    gradle.taskGraph.whenReady { graph ->
        // Named explicitly rather than pattern-matched: `^packageRelease.*`
        // also catches packageReleaseResources and packageReleaseAssets, which
        // sign nothing and would make the error name the wrong task.
        def releaseArtifactTasks = [
            'assembleRelease', 'bundleRelease', 'installRelease',
            'packageRelease', 'packageReleaseBundle', 'packageReleaseUniversalApk',
            'signReleaseBundle',
        ]
        def offender = graph.allTasks.find { t ->
            t.project.path == project.path && t.name in releaseArtifactTasks
        }
        if (offender != null) {
            throw new GradleException(
                "Refusing to build ${offender.path}: release signing credentials are missing.\n" +
                "Set CHATTERBOX_STORE_FILE, CHATTERBOX_STORE_PASSWORD, CHATTERBOX_KEY_ALIAS and\n" +
                "CHATTERBOX_KEY_PASSWORD as environment variables, or in ~/.gradle/gradle.properties.\n" +
                "A release must never be signed with the debug key, so there is no fallback."
            )
        }
    }
}

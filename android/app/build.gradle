apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.google.gms.google-services"
apply plugin: "com.google.firebase.crashlytics"
apply plugin: "com.facebook.react"

// Use first existing node path so codegen works from IDE (PATH often missing /opt/homebrew/bin or /usr/local/bin).
def nodePath = "node"
["/opt/homebrew/bin/node", "/usr/local/bin/node"].each { p ->
    if (new File(p).exists()) { nodePath = p }
}
react {
    nodeExecutableAndArgs.set([nodePath])
    // Required so the app gets implementation project() for each native module (fixes "package does not exist").
    autolinkLibrariesWithApp()
}

def enableProguardInReleaseBuilds = true

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = 'org.webkit:android-jsc-intl:+'`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'org.webkit:android-jsc:+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.chatterbox.app"
    defaultConfig {
        applicationId "com.chatterbox.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            // Read from environment variables or gradle.properties — never hardcode secrets.
            // Set these in ~/.gradle/gradle.properties or your CI environment:
            //   CHATTERBOX_STORE_FILE=/path/to/release.keystore
            //   CHATTERBOX_STORE_PASSWORD=...
            //   CHATTERBOX_KEY_ALIAS=...
            //   CHATTERBOX_KEY_PASSWORD=...
            storeFile file(System.getenv("CHATTERBOX_STORE_FILE") ?: project.findProperty("CHATTERBOX_STORE_FILE") ?: "debug.keystore")
            storePassword System.getenv("CHATTERBOX_STORE_PASSWORD") ?: project.findProperty("CHATTERBOX_STORE_PASSWORD") ?: "android"
            keyAlias System.getenv("CHATTERBOX_KEY_ALIAS") ?: project.findProperty("CHATTERBOX_KEY_ALIAS") ?: "androiddebugkey"
            keyPassword System.getenv("CHATTERBOX_KEY_PASSWORD") ?: project.findProperty("CHATTERBOX_KEY_PASSWORD") ?: "android"
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
    sourceSets {
        main {
            java {
                // Avoid duplicate PackageList from legacy rncli generator.
                exclude "**/generated/rncli/**"
            }
        }
    }
}

afterEvaluate {
    // Use the new autolinking task; disable legacy generator to avoid duplicates.
    tasks.matching { it.name == "generatePackageList" }.configureEach {
        enabled = false
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    // Firebase BoM for consistent SDK versions (aligned with @react-native-firebase 21.7.x)
    implementation platform('com.google.firebase:firebase-bom:33.12.0')
    implementation 'com.google.firebase:firebase-database'

    // Fresco animated GIF/WebP — must match RN 0.80's Fresco 3.6.0
    implementation 'com.facebook.fresco:animated-gif:3.6.0'
    implementation 'com.facebook.fresco:animated-webp:3.6.0'
    implementation 'com.facebook.fresco:webpsupport:3.6.0'

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

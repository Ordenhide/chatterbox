buildscript {
    // Robustly resolve 'node' path for IDE-launched daemons.
    def nodeName = System.getProperty("os.name").toLowerCase().contains("windows") ? "node.exe" : "node"
    def discoveredNodePath = (
        (System.getenv("PATH")?.split(File.pathSeparator) as List ?: []) +
        (new File(System.getProperty("user.home"), ".nvm/versions/node").listFiles()?.collect { new File(it, "bin").absolutePath } ?: []) +
        ["/opt/homebrew/bin", "/usr/local/bin"]
    ).find { it && new File(it.toString(), nodeName).exists() }
    discoveredNodePath = discoveredNodePath ? new File(discoveredNodePath.toString(), nodeName).absolutePath : nodeName

    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        // NDK 25. For nitro-modules C++20 errors, install NDK 27 via Android Studio (see android/ANDROID_NDK.md)
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.20"
        // Tell react-native-gesture-handler (and similar libs) where React Native
        // lives, so they skip the `node` CLI call that fails in IDE-launched daemons.
        REACT_NATIVE_NODE_MODULES_DIR = "$rootDir/../node_modules/react-native"
        NODE_BINARY = discoveredNodePath
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:8.12.0")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion")
        classpath("com.google.gms:google-services:4.5.0")
    }
}

plugins {
    id("com.facebook.react.rootproject")
}

// project.ext should match buildscript.ext for consistency across modules.
def nodeNameForProject = System.getProperty("os.name").toLowerCase().contains("windows") ? "node.exe" : "node"
def projectDiscoveredNodePath = (
    (System.getenv("PATH")?.split(File.pathSeparator) as List ?: []) +
    (new File(System.getProperty("user.home"), ".nvm/versions/node").listFiles()?.collect { new File(it, "bin").absolutePath } ?: []) +
    ["/opt/homebrew/bin", "/usr/local/bin"]
).find { it && new File(it.toString(), nodeNameForProject).exists() }
projectDiscoveredNodePath = projectDiscoveredNodePath ? new File(projectDiscoveredNodePath.toString(), nodeNameForProject).absolutePath : "node"

ext {
    buildToolsVersion = "36.0.0"
    minSdkVersion = 24
    compileSdkVersion = 36
    targetSdkVersion = 36
    ndkVersion = "27.1.12297006"
    kotlinVersion = "2.1.20"
    REACT_NATIVE_NODE_MODULES_DIR = "$rootDir/../node_modules/react-native"
    NODE_BINARY = projectDiscoveredNodePath
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url "$rootDir/../node_modules/react-native/android" }
        maven { url 'https://www.jitpack.io' }

    }

}

subprojects {
    buildscript {
        repositories {
            google()
            mavenCentral()
            gradlePluginPortal()
        }
    }
}

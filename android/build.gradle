buildscript {
    // Use first existing node path so codegen works from IDE (PATH often missing /opt/homebrew/bin or /usr/local/bin).
    def discoveredNodePath = "node"
    def nvmDefault = new File("${System.getProperty('user.home')}/.nvm/alias/default")
    def nvmCandidates = []
    if (nvmDefault.exists()) {
        def nvmVersionDirs = new File("${System.getProperty('user.home')}/.nvm/versions/node").listFiles()
        if (nvmVersionDirs != null) { nvmVersionDirs.each { d -> nvmCandidates << "${d}/bin/node" } }
    }
    (["/opt/homebrew/bin/node", "/usr/local/bin/node"] + nvmCandidates).each { p ->
        if (new File(p).exists()) { discoveredNodePath = p }
    }

    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        // NDK 25. For nitro-modules C++20 errors, install NDK 27 via Android Studio (see android/ANDROID_NDK.md)
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.20"
        // Tell react-native-gesture-handler (and similar libs) where React Native
        // lives, so they skip the `node` CLI call that fails in IDE-launched daemons.
        REACT_NATIVE_NODE_MODULES_DIR = "$rootDir/../node_modules/react-native"
        NODE_BINARY = discoveredNodePath
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:8.12.0")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion")
        classpath("com.google.gms:google-services:4.5.0")
        classpath("com.google.firebase:firebase-crashlytics-gradle:3.0.7")
    }
}

plugins {
    id("com.facebook.react.rootproject")
}

// buildscript's ext {} above only sets buildscript.ext, not project.ext, so
// autolinked native modules reading rootProject.ext.* (e.g. async-storage's
// getKotlinVersion(), or app/build.gradle's rootProject.ext.NODE_BINARY)
// never see it and fall back to their own defaults, pulling in a separate
// Kotlin Gradle Plugin classpath/classloader than the one used here. Mirror
// the same values on project.ext to keep every module on one Kotlin version
// and classloader.
def projectDiscoveredNodePath = "node"
def projectNvmDefault = new File("${System.getProperty('user.home')}/.nvm/alias/default")
def projectNvmCandidates = []
if (projectNvmDefault.exists()) {
    def nvmVersionDirs = new File("${System.getProperty('user.home')}/.nvm/versions/node").listFiles()
    if (nvmVersionDirs != null) { nvmVersionDirs.each { d -> projectNvmCandidates << "${d}/bin/node" } }
}
(["/opt/homebrew/bin/node", "/usr/local/bin/node"] + projectNvmCandidates).each { p ->
    if (new File(p).exists()) { projectDiscoveredNodePath = p }
}

ext {
    buildToolsVersion = "36.0.0"
    minSdkVersion = 24
    compileSdkVersion = 36
    targetSdkVersion = 36
    ndkVersion = "27.1.12297006"
    kotlinVersion = "2.1.20"
    REACT_NATIVE_NODE_MODULES_DIR = "$rootDir/../node_modules/react-native"
    NODE_BINARY = projectDiscoveredNodePath
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url "$rootDir/../node_modules/react-native/android" }
        maven { url 'https://www.jitpack.io' }

    }

}

subprojects {
    buildscript {
        repositories {
            google()
            mavenCentral()
            gradlePluginPortal()
        }
    }
}
